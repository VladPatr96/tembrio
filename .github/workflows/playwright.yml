name: "Playwright"
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.*"
      - "playwright.config.*"
      - "tests/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    # The same image `bun run test:visual` uses locally, so screenshot
    # baselines match pixel for pixel. Keep the tag in step with
    # @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5

      # setup-bun needs unzip, which the Playwright image lacks; npm is there.
      - name: Install Bun
        run: npm install -g bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Scenarios and screenshots
        run: npx playwright test
        env:
          HOME: /root

      - name: Upload report and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # __screenshots__: a run with missing baselines writes them here;
          # download, review and commit them to start comparing.
          path: |
            playwright-report/
            test-results/
            tests/visual/__screenshots__/
          retention-days: 7
