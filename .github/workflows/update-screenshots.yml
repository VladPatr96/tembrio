name: "Update screenshots"
# Manual button: retake the screenshot baselines on the chosen branch and
# commit them there. Look through every changed PNG in the PR before merging.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5

      # setup-bun needs unzip, which the Playwright image lacks; npm is there.
      - name: Install Bun
        run: npm install -g bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Retake baselines
        run: npx playwright test --project=visual --update-snapshots
        env:
          HOME: /root

      - name: Commit changed baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "Update screenshot baselines"
            git push
          fi
